<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff login — City General Hospital</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="brand login-brand">
      <span class="logo">+</span>
      <div>
        <strong>City General</strong>
        <small>Staff login</small>
      </div>
    </div>
    {% if flash %}
    <div class="toast {{ kind }}">{{ flash }}</div>
    {% endif %}
    <form class="card form" method="post" action="{{ url_for('login') }}">
      <h1>Nurse / admin sign in</h1>
      <p class="hint">Only a logged-in nurse or admin can override AI triage decisions.</p>
      <input type="hidden" name="next" value="{{ next }}" />
      <label>Username
        <input name="username" required autocomplete="username" placeholder="nurse or admin" />
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="hint demo">Demo accounts: <code>nurse</code> / <code>nurse123</code> · <code>admin</code> / <code>admin123</code></p>
      <p><a href="/?view=intake">Back to patient registration</a></p>
    </form>
  </main>
</body>
</html>
